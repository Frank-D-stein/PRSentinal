[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-sentinel"
version = "0.1.0"
description = "A GitHub Action that automatically scores incoming pull requests for quality"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.3.0",
    "anthropic>=0.26.0",
    "unidiff>=0.7.5",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
